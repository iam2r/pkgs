packages:
  - '.'
  - 'packages/*'
# Monorepo postinstall runs turbo build:pkg. pnpm 11's default
# verifyDepsBeforeRun: install re-enters install from package scripts,
# which re-fires postinstall and can fail with runDepsStatusCheck.
# Settings live in this file (not .npmrc) on pnpm 11+.
verifyDepsBeforeRun: false
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
# 仅 monorepo 通用/工具链级覆盖；业务包版本在各 package.json 自管。
overrides:
  'typescript': '^7.0.2'
  'vitest': '5.0.5'
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.3.0'
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/pi-codemode@1.3.0'
  - '@earendil-works/pi-coding-agent@1.3.0'
  - '@earendil-works/pi-mcp@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
  - '@earendil-works/pi-tui@1.3.0'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
